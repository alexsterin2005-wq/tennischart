<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0F12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* ===== Broadcast theme (signature, dark) ===== */
:root{
  --bg:#0D0F12; --surface:#16191F; --surface2:#1F232B; --fg:#F5F6F8; --muted:#A3ABB8; --line:#2C313B;
  --accent:#FF6B1A; --accent-ink:#1A0900; --court:var(--accent);
  --me:#FF6B1A; --me-ink:#1A0900; --opp:#3DB8FF; --opp-ink:#03131D; --opp-ink-fg:#03131D;
  --ball:#E6FF3B; --warn:#FFB020; --good:#2EE59D; --bad:#FF4D6A; --mp:#B07CFF;
  --display:"Barlow Condensed",Impact,"Arial Narrow",sans-serif; --body:"Barlow",system-ui,-apple-system,sans-serif;
  --glow:0 0 0 1px rgba(255,107,26,.35),0 8px 30px rgba(255,107,26,.18);
  --cols:minmax(0,1fr) 56px 30px 40px 60px;
  color-scheme:dark;
}
/* ===== Sun mode (bright courts) ===== */
:root.sun{
  --bg:#FFFFFF; --surface:#F2F3F5; --surface2:#E4E6EA; --fg:#000000; --muted:#30343B; --line:#6B7280;
  --accent:#D94800; --accent-ink:#FFFFFF;
  --me:#D94800; --me-ink:#FFFFFF; --opp:#005A9E; --opp-ink:#FFFFFF;
  --ball:#B8D000; --warn:#8A4200; --good:#0B7A3B; --bad:#B0001C; --mp:#6A1FB3;
  --glow:none; color-scheme:light;
}
:root.sun .board,:root.sun .editbar button,:root.sun .action,:root.sun .ghost,:root.sun .format,:root.sun .stats,:root.sun .court{border-width:2.5px;border-color:#000}
:root.sun .board{background:#fff}
:root.sun .board .bh{background:#000;color:#fff}
:root.sun .srow{border-top-width:2px}
:root.sun .srow .bar{background:#D5D9DF;border:1px solid #6B7280}
:root.sun .list .item{background:#EEF0F3;border:1.5px solid #9AA1AD}
:root.sun .tabs,:root.sun .seg{border:2px solid #6B7280}
:root.sun .court{background:#fff;color:#000}
:root.sun .court input{background:#fff;color:#000;border:2px solid #000}
:root.sun .final{background:#000}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input::placeholder{color:var(--muted);opacity:.8}
input:focus,select:focus{border-color:var(--accent);outline:none}
.app{height:100%;position:relative;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;max-width:560px;margin:0 auto;gap:12px}
.screen{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
#s-setup{overflow:auto;justify-content:flex-start;padding-bottom:40vh}
#s-live{overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
#s-live .stage{overflow:hidden}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
.app.setup-mode{height:auto;min-height:100%}
#s-setup .court input{font-size:18px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;font-weight:800}
h1{font-size:40px;line-height:1;font-style:italic}
h2{font-size:24px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:700}
.big{min-height:64px;border-radius:14px;font-family:var(--display);font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;padding:0 14px;text-align:center;transition:transform .08s,filter .08s}
.big:active{transform:scale(.97)}
.primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.ghost{background:var(--surface);border:1.5px solid var(--line)}
.backbtn{background:var(--fg);color:var(--bg);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
:root.sun .backbtn{box-shadow:none}
.action{background:var(--surface2);border:1.5px solid var(--line);color:var(--fg)}
.action:active{border-color:var(--accent)}
.action:active,.primary:active,.me-btn:active,.opp-btn:active{filter:brightness(.88)}
.big-chips button{border:1.5px solid var(--line);color:var(--fg)}
.close{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.close:active{background:var(--surface2)}
#end-yes.close{border-color:var(--bad);color:var(--bad)}
.ball-btn{background:var(--ball);color:#1b2a10}
.me-btn{background:var(--me);color:var(--me-ink)}
.opp-btn{background:var(--opp);color:var(--opp-ink)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.hint{font-size:15px;color:var(--muted);text-align:center;min-height:18px}
/* ===== Setup: matchup card ===== */
.court{background:linear-gradient(155deg,var(--surface2),var(--surface) 70%);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;color:var(--fg);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.court::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--opp) 50%,var(--me) 50%)}
.court .net{height:2px;background:linear-gradient(90deg,transparent,var(--line) 15%,var(--line) 85%,transparent);margin:12px 0;position:relative}
.court .net::after{content:"VS";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) skewX(-8deg);background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.08em;padding:2px 12px;border-radius:6px}
.court label{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;display:block;margin-bottom:6px}
.court input{background:var(--bg);color:var(--fg);border-color:var(--line)}
.court .side{display:flex;flex-direction:column;gap:4px}
.format{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.footlink{align-self:center;font-size:13px;color:var(--muted);padding:8px 10px;text-align:center}
.namerow{display:flex;gap:8px}
.namerow input:first-child{flex:1;min-width:0}
.court input.utr{width:78px;flex:none;text-align:center;font-family:var(--display);font-weight:700;font-size:20px}
.court .fine{font-size:13px;color:var(--muted);margin:2px 0 0}
.utrnote{display:flex;gap:10px;align-items:center;background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.45);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.3;color:var(--fg)}
.utrnote b{color:var(--warn)}
.utrnote .ic{flex:none;width:26px;height:26px;border-radius:50%;background:var(--warn);color:#1A0E00;font-family:var(--display);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.utrnote.ok{background:rgba(46,229,157,.1);border-color:rgba(46,229,157,.45)}
.utrnote.ok b{color:var(--good)} .utrnote.ok .ic{background:var(--good)}
:root.sun .utrnote{border-width:2px}
.board .noutr{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* ===== Live: TV score bug ===== */
.board{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .5s}
.board.flash{box-shadow:0 0 0 3px var(--accent);transition:box-shadow .08s}
.board .bh{display:grid;grid-template-columns:var(--cols);align-items:center;gap:0 6px;padding:6px 12px 5px;background:var(--surface2);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.board .bh .tag{grid-column:1/3;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.board .bh .live{background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:4px;font-family:var(--display);font-size:13px;letter-spacing:.1em;transform:skewX(-8deg)}
.board .bh .c{text-align:center}
.board .prow{display:grid;grid-template-columns:var(--cols);align-items:stretch;gap:0 6px;padding:0 12px;min-height:58px;position:relative}
.board .prow+.prow{border-top:1px solid var(--line)}
.board .prow::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--me)}
.board .prow.p2::before{background:var(--opp)}
.board .who{font-family:var(--display);font-size:22px;font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:7px;min-width:0;letter-spacing:.02em}
.board .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1}
.board .ball{width:11px;height:11px;border-radius:50%;background:var(--ball);flex:none;box-shadow:0 0 10px var(--ball);visibility:hidden;order:2}
.board .who.serving .ball{visibility:visible}
.board .sets,.board .games,.board .pt{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;line-height:1}
.board .sets{font-size:22px;color:var(--muted)}
.board .games{font-size:34px;color:var(--fg)}
.board .pt{font-size:34px;background:var(--accent);color:var(--accent-ink);margin:0 -12px 0 0;padding-right:4px}
.board .prow+.prow .pt{border-top:1px solid rgba(0,0,0,.18)}
.board .bh .ptc{background:var(--accent);color:var(--accent-ink);margin:-6px -12px -5px 0;padding:6px 4px 5px 0;align-self:stretch;display:flex;align-items:center;justify-content:center}
.board .odds{align-self:center;justify-self:center;font-family:var(--display);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;padding:2px 0;width:54px;text-align:center;border-radius:8px;line-height:1.2;transition:color .35s,background .35s;background:var(--surface2)}
.board .odds.lead{color:var(--good);background:rgba(46,229,157,.13)}
.board .odds.trail{color:var(--bad);background:rgba(255,77,106,.13)}
.board .odds.even{color:var(--muted)}
:root.sun .board .odds.lead{background:rgba(11,122,59,.12)}
:root.sun .board .odds.trail{background:rgba(176,0,28,.1)}
.board .odds.bump{animation:oddsbump .5s ease-out}
@keyframes oddsbump{0%{transform:scale(1.22)}100%{transform:scale(1)}}
.board .wpbar{display:flex;height:5px;background:var(--line)}
.board .wpbar i{display:block;height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.board .wpbar i:first-child{background:var(--me)}
.board .wpbar i:last-child{background:var(--opp)}
.board .who.won span,.board .pt.won{animation:won .6s ease-out}
@keyframes won{0%{transform:scale(1.18);filter:brightness(1.5)}100%{transform:scale(1);filter:none}}
@media (prefers-reduced-motion:reduce){.board .who.won span,.board .pt.won,.board .odds.bump{animation:none}.board .wpbar i{transition:none}}
.board .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--line)}
.board .bigpt{flex:0 1 auto;background:var(--bad);color:#fff;font-family:var(--display);font-size:16px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 12px;border-radius:6px;transform:skewX(-8deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;animation:pulse 1.4s ease-in-out infinite}
.board .bigpt.sp{background:var(--warn);color:#1A0E00}
.board .bigpt.mp{background:var(--mp)}
@keyframes pulse{50%{filter:brightness(1.18)}}
@media (prefers-reduced-motion:reduce){.board .bigpt{animation:none}}
.board .pencil{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:25}
.banner div{background:var(--surface2);color:var(--fg);border-top:4px solid var(--accent);font-family:var(--display);font-size:42px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.04em;padding:18px 32px;border-radius:14px;text-align:center;line-height:1.05;animation:bannerin 1.3s ease-out forwards;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.banner small{display:block;font-family:var(--display);font-style:normal;font-size:30px;color:var(--accent);letter-spacing:.06em;margin-top:6px}
@keyframes bannerin{0%{opacity:0;transform:translateX(-30px) skewX(-6deg)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.banner div{animation:none}}
.stage{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:flex-end;min-height:0}
.stage .servelabel{padding-top:6px}
.stage>.row,.stage>.big-chips{flex:1;min-height:0;max-height:52vh}
.stage>.row .big{height:100%;font-size:38px}
.stage>.row #w-p1,.stage>.row #w-p2{font-size:clamp(20px,7.2vw,32px);line-height:1.05;overflow-wrap:anywhere;hyphens:auto;padding:0 8px}
.stage>.row.how .big{font-size:clamp(16px,4.6vw,21px)}
.stage>.big-chips{align-content:stretch}
.stage>.big-chips button{flex:1 1 30%;min-height:0;height:auto}
.stage>.big-chips button.skip{flex:1 1 100%;max-height:52px}
.stage>#go-summary{flex:1;max-height:30vh}
.servelabel{font-family:var(--display);font-size:26px;font-weight:800;text-transform:uppercase;text-align:center;letter-spacing:.05em}
.servelabel.second .sv{color:var(--warn)}
.pc.p1{color:var(--me)} .pc.p2{color:var(--opp)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{min-height:44px;padding:0 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big-chips button{min-height:60px;flex:1 1 30%;font-family:var(--display);font-size:23px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border-radius:14px;background:var(--surface2)}
.big-chips button:active{border-color:var(--accent);transform:scale(.97)}
.big-chips button.skip{flex:1 1 100%;background:transparent;color:var(--muted);font-family:var(--body);font-weight:600;font-size:16px;text-transform:none;min-height:48px;border-style:dashed}
.row.how .big{font-size:clamp(16px,4.6vw,21px);line-height:1.05;padding:0 4px;letter-spacing:.02em}
.editbar{display:flex;gap:8px;padding-bottom:env(safe-area-inset-bottom,0px)}
.editbar button{flex:1;min-height:52px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px}
.editbar button.end{flex:.6;color:var(--fg)}
.editbar #btn-undo{flex:1.4;border:1.5px solid var(--warn);color:var(--warn)}
.editbar #btn-undo:active{background:var(--warn);color:#1A0E00}
.editbar #btn-undo:disabled{opacity:.4}
#btn-endmatch{color:var(--bad)!important}
/* ===== Sheets ===== */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-right,0px))}
.sheet .panel{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:20px 16px 16px;width:100%;max-width:560px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px;position:relative}
.sheet .panel::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.list{display:flex;flex-direction:column;gap:6px}
.list .item{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--surface2);text-align:left}
.list .item .sc{font-family:var(--display);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.list .item .ev{font-size:15px}
.list .item .tag{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.warnrow{color:var(--warn);font-weight:600;font-size:14px}
/* ===== Summary ===== */
.summary{overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:12px}
.summary>*{flex:none}
.final{background:linear-gradient(155deg,var(--surface2),var(--surface) 75%);color:var(--fg);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
:root.sun .final{color:#fff;border-color:#000;border-left-color:var(--accent)}
.final .n{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase}
.final .s{font-family:var(--display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.final .w{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700}
.km{display:flex;flex-direction:column;gap:6px}
.km .item{grid-template-columns:auto 1fr auto}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{flex:1;min-height:42px;border-radius:8px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stats{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stats .head{display:grid;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);align-items:center;padding:12px;gap:6px;font-size:17px}
.stats .head .nm{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.stats .head .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats .head .nm.r{justify-content:flex-end}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;flex:none}
.av.p1{background:var(--me);color:var(--me-ink)} .av.p2{background:var(--opp);color:var(--opp-ink)}
.stats .sec{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 12px;background:var(--surface2);border-top:1px solid var(--line);border-bottom:2px solid var(--accent);color:var(--fg);font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
.stats .sec .n{font-family:var(--body);font-size:11px;min-width:0;font-weight:700;letter-spacing:.06em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats .sec .n.r{text-align:right}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);align-items:center;min-height:46px;border-top:1px solid var(--line)}
.srow .v{display:flex;align-items:center;gap:6px;padding:6px 6px;font-size:13px;font-variant-numeric:tabular-nums;font-weight:700;min-width:0}
.srow .v.l{flex-direction:row}
.srow .v.r{flex-direction:row-reverse}
.srow .v .num{flex:none;width:auto;min-width:56px;white-space:nowrap;font-size:13px}
.srow .v.l .num{text-align:left}
.srow .v.r .num{text-align:right}
.srow .bar{flex:1;min-width:24px;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;position:relative}
.srow .bar i{position:absolute;top:0;bottom:0;display:block;border-radius:5px}
.srow .v.l .bar i{right:0;background:var(--me)}
.srow .v.r .bar i{left:0;background:var(--opp)}
.srow .lab{background:var(--surface2);align-self:stretch;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 6px;line-height:1.2;color:var(--fg)}
.srow.sub .lab{font-size:11px;background:transparent;color:var(--muted)}
.srow.sub{min-height:34px;border-top:1px dashed var(--line)}
.srow.clickable .lab{cursor:pointer;text-decoration:underline dotted}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fields label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
textarea#report{width:100%;min-height:160px;font:13px/1.4 ui-monospace,Menlo,monospace;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--fg)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.big:active{transform:none}}

<body>


<div class="app" id="app">

<!-- SETUP -->

  </div>

      <div class="namerow"><input id="p2name" placeholder="Opponent name" autocomplete="off" maxlength="50"><input id="p2utr" class="utr" placeholder="UTR" inputmode="decimal" maxlength="5" autocomplete="off" aria-label="Opponent UTR, optional"></div>
    </div>
    <div class="net"></div>
    <div class="side">
      <label for="p1name">Your player</label>
      <div class="namerow"><input id="p1name" placeholder="Your player's name" autocomplete="off" maxlength="50"><input id="p1utr" class="utr" placeholder="UTR" inputmode="decimal" maxlength="5" autocomplete="off" aria-label="Your player UTR, optional"></div>
      <button id="p1last" class="chips" hidden style="align-self:flex-start;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px"></button>
    </div>
    <div class="utrnote" id="utr-note" role="note"><span class="ic" aria-hidden="true">%</span><span id="utr-note-t"><b>Want live win odds?</b> Add both players' UTR. Optional, you can skip it.</span></div>
  </div>

<!-- LIVE -->

    <div class="bh"><span class="tag"><span class="live">Live</span><span id="b-setlabel">Set 1</span></span><span class="c">Sets</span><span class="c">Gms</span><span class="c ptc" id="b-ptslabel">Pts</span></div>
    <div class="prow p1">

    <div class="foot"><span class="bigpt" id="b-bigpt" hidden></span><span class="noutr" id="b-noutr" hidden>No UTR · odds start 50/50</span>

    <button class="big primary" id="btn-image" style="font-size:20px">Copy stats</button>

<div id="sheetroot"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= ENGINE (pure) ================= */
const other = p => p === "p1" ? "p2" : "p1";
const PTS = ["0","15","30","40"];

function compute(match){
  const cfg = match.config;
  const st = {
    sets: [],            // {games:[a,b], tb:[a,b]|null, mtb:boolean, winner}
    setIdx: 0, g:[0,0], p:[0,0],
    tb:false, mtb:false, tbFirst:null, tbIdx:0,
    server: cfg.firstServer, serveNum:1, awaiting:false,
    points: [], games: [], markers: [], over:false, winner:null,
    pendingUnsure:false
  };
  const idx = pl => pl === "p1" ? 0 : 1;
  const setsWon = pl => st.sets.filter(s=>s.winner===pl).length;

  function startSet(){
    st.g=[0,0]; st.p=[0,0]; st.tb=false; st.tbIdx=0;
    st.mtb = (st.setIdx===2 && cfg.thirdSet==="match_tiebreak_10");
    if (st.mtb){ st.tbFirst = st.server; }
  }
  function curServer(){
    if (st.tb || st.mtb){
      const k = st.tbIdx;
      if (k===0) return st.tbFirst;
      return (Math.floor((k-1)/2)%2===0) ? other(st.tbFirst) : st.tbFirst;
    }
    return st.server;
  }
  function disp(){
    if (st.tb||st.mtb) return [String(st.p[0]),String(st.p[1])];
    const [a,b]=st.p;
    if (a>=3&&b>=3){
      if (a===b) return ["40","40"];
      return a>b ? ["AD","40"] : ["40","AD"];
    }
    return [PTS[Math.min(a,3)],PTS[Math.min(b,3)]];
  }
  function scoreStr(){ const d=disp(); const s=curServer(); return s==="p1"?`${d[0]}-${d[1]}`:`${d[1]}-${d[0]}`; }
  function wouldWinGame(pl){
    const p=st.p.slice(); p[idx(pl)]++;
    const w=idx(pl), l=1-w;
    if (st.tb||st.mtb){ const t=st.mtb?10:7; return p[w]>=t && p[w]-p[l]>=2; }
    if (cfg.scoring==="no_ad") return p[w]>=4;
    return p[w]>=4 && p[w]-p[l]>=2;
  }
  function wouldWinSet(pl){
    if (!wouldWinGame(pl)) return false;
    if (st.tb||st.mtb) return true;
    const g=st.g.slice(); g[idx(pl)]++; const w=idx(pl),l=1-w;
    return g[w]>=6 && g[w]-g[l]>=2;
  }
  function flags(){
    const s=curServer(), r=other(s);
    const bp = !(st.tb||st.mtb) && wouldWinGame(r);
    const sp = ["p1","p2"].filter(pl=>wouldWinSet(pl));
    const mp = sp.filter(pl=>setsWon(pl)===1);
    return {bp, sp, mp};
  }
  function recordPoint(winner, how, shot){
    if (st.over) return;
    const s=curServer(); const f=flags();
    st.points.push({ setIdx:st.setIdx, server:s, serveNum:st.serveNum, winner, how, shot:shot||null,
      before:scoreStr(), bp:f.bp, sp:f.sp.length>0, mp:f.mp.length>0, bpFor: f.bp?other(s):null,
      spFor:f.sp, mpFor:f.mp, unsure: st.pendingUnsure });
    st.pendingUnsure=false;
    st.serveNum=1; st.awaiting=false;
    const w=idx(winner);
    st.p[w]++;
    if (st.tb||st.mtb){
      st.tbIdx++;
      const t=st.mtb?10:7;
      if (st.p[w]>=t && st.p[w]-st.p[1-w]>=2){
        if (st.mtb){
          st.sets.push({games:[w===0?1:0,w===1?1:0], tb:st.p.slice(), mtb:true, winner});
        } else {
          st.g[w]++;
          st.sets.push({games:st.g.slice(), tb:st.p.slice(), mtb:false, winner});
        }
        st.games.push({setIdx:st.setIdx, server:st.tbFirst, winner, tb:true});
        st.server = other(st.tbFirst);
        endSetCheck();
      }
      return;
    }
    const win = cfg.scoring==="no_ad" ? st.p[w]>=4 : (st.p[w]>=4 && st.p[w]-st.p[1-w]>=2);
    if (win){
      st.games.push({setIdx:st.setIdx, server:s, winner, tb:false});
      st.g[w]++; st.p=[0,0]; st.server=other(st.server);
      if (st.g[w]>=6 && st.g[w]-st.g[1-w]>=2){
        st.sets.push({games:st.g.slice(), tb:null, mtb:false, winner});
        endSetCheck();
      } else if (st.g[0]===6 && st.g[1]===6){
        st.tb=true; st.tbFirst=st.server; st.tbIdx=0; st.p=[0,0];
      }
    }
  }
  function endSetCheck(){
    const w1=setsWon("p1"), w2=setsWon("p2");
    if (w1===2||w2===2){ st.over=true; st.winner = w1===2?"p1":"p2"; st.g=[0,0]; st.p=[0,0]; st.tb=false; st.mtb=false; return; }
    st.setIdx++; startSet();
  }
  startSet();

  for (const e of match.events){
    if (st.over && e.type!=="fix_score") continue;
    switch(e.type){
      case "serve_fault":
        if (st.serveNum===1){ st.serveNum=2; }
        else { recordPoint(other(curServer()), "double_fault", null); }
        break;
      case "serve_in": st.awaiting=true; break;
      case "point": recordPoint(e.winner, e.how, e.shot||null); break;
      case "shot": { const lp=st.points[st.points.length-1]; if (lp) lp.shot=e.shot; break; }
      case "rally": { const lp=st.points[st.points.length-1]; if (lp) lp.rally=e.rally; break; }
      case "let": st.markers.push({setIdx:st.setIdx, before:scoreStr(), kind:"let"}); break;
      case "replay": st.serveNum=1; st.awaiting=false; st.markers.push({setIdx:st.setIdx, before:scoreStr(), kind:"replay"}); break;
      case "note": st.markers.push({setIdx:st.setIdx, before:scoreStr(), games:`${st.g[0]}-${st.g[1]}`, kind:"note", text:e.text, ts:e.ts}); break;
      case "server_swap":
        if (st.tb||st.mtb){ st.tbFirst=other(st.tbFirst); } else { st.server=other(st.server); }
        break;
      case "fix_score":
        if (e.unsure){ st.markers.push({setIdx:st.setIdx, before:scoreStr(), kind:"unsure"}); st.pendingUnsure=true; }
        if (e.games){ st.g=[e.games[0],e.games[1]]; }
        if (e.points && !(st.tb||st.mtb)){
          const map = v => v==="AD"?4:PTS.indexOf(v);
          let a=map(e.points[0]), b=map(e.points[1]);
          if (a===4&&b===4){a=3;b=3;}
          if (a===4) b=3; if (b===4) a=3;
          st.p=[a,b];
        }
        if (e.server){ st.server=e.server; }
        st.serveNum=1; st.awaiting=false;
        st.markers.push({setIdx:st.setIdx, before:scoreStr(), kind:"fix"});
        break;
    }
  }
  st.disp = disp(); st.curServer = curServer(); st.scoreStr = scoreStr(); st.flags = st.over?{bp:false,sp:[],mp:[]}:flags();
  st.setsWon=[setsWon("p1"),setsWon("p2")];
  st.inTiebreak = st.tb||st.mtb;
  return st;
}

function undoLabel(match){
  let i=match.events.length-1;
  while(i>=0 && (match.events[i].type==="shot"||match.events[i].type==="rally")) i--;
  const e=match.events[i];
  if(!e) return "Undo";
  return {serve_fault:"Undo fault", serve_in:"Undo serve", point:"Undo point", let:"Undo let", replay:"Undo replay", note:"Undo note", server_swap:"Undo server", fix_score:"Undo score fix"}[e.type]||"Undo";
}

function computeStats(match, st, setFilter){
  const pts = st.points.filter(p=>setFilter==null||p.setIdx===setFilter);
  const games = st.games.filter(g=>setFilter==null||g.setIdx===setFilter);
  const S = {p1:{},p2:{}};
  const SHOTS=["fh","bh","slice_drop","overhead","volley","serve","return"];
  for (const pl of ["p1","p2"]){
    const o=other(pl);
    const serve = pts.filter(p=>p.server===pl);
    const ret = pts.filter(p=>p.server===o);
    const s1=serve.filter(p=>p.serveNum===1), s2=serve.filter(p=>p.serveNum===2);
    const r1=ret.filter(p=>p.serveNum===1), r2=ret.filter(p=>p.serveNum===2);
    const bpFaced=serve.filter(p=>p.bp), bpHad=ret.filter(p=>p.bp);
    const hitter = p => p.how==="winner"?p.winner:other(p.winner);
    const byShot = how => { const m={}; SHOTS.forEach(s=>m[s]=0); let tot=0;
      pts.filter(p=>p.how===how && hitter(p)===pl).forEach(p=>{tot++; if(p.shot) m[p.shot]++;}); return {tot,m}; };
    const net = pts.filter(p=>(p.shot==="volley"||p.shot==="overhead") && hitter(p)===pl);
    const x=S[pl];
    x.aces = pts.filter(p=>p.server===pl&&p.how==="winner"&&p.shot==="serve"&&p.winner===pl).length;
    x.df = serve.filter(p=>p.how==="double_fault").length;
    x.firstIn=[s1.length, serve.length];
    x.firstWon=[s1.filter(p=>p.winner===pl).length, s1.length];
    x.secondWon=[s2.filter(p=>p.winner===pl).length, s2.length];
    x.bpSaved=[bpFaced.filter(p=>p.winner===pl).length, bpFaced.length];
    x.serviceGames=games.filter(g=>g.server===pl).length;
    x.r1Won=[r1.filter(p=>p.winner===pl).length, r1.length];
    x.r2Won=[r2.filter(p=>p.winner===pl).length, r2.length];
    x.bpConv=[bpHad.filter(p=>p.winner===pl).length, bpHad.length];
    x.returnGames=games.filter(g=>g.server===o).length;
    x.netWon=[net.filter(p=>p.winner===pl).length, net.length];
    x.winners=byShot("winner"); x.fe=byShot("forced_error"); x.ue=byShot("unforced_error");
    x.servePtsWon=[serve.filter(p=>p.winner===pl).length, serve.length];
    x.returnPtsWon=[ret.filter(p=>p.winner===pl).length, ret.length];
    x.totalWon=[pts.filter(p=>p.winner===pl).length, pts.length];
    const rl=k=>{ const r=pts.filter(p=>p.rally===k); return [r.filter(p=>p.winner===pl).length, r.length]; };
    x.rallyShort=rl("short"); x.rallyMed=rl("medium"); x.rallyLong=rl("long");
  }
  return S;
}

/* ================= WINPROB (reads engine state only; never changes it) ================= */
const WP = { utrScale: 1.5, gapCap: 2.5, baseServe: 0.60, priorWeight: 80 };
function wpOther(p){ return p==="p1"?"p2":"p1"; }
function wpModel(pa, pb, cfg){
  // pa = chance p1 wins a point on p1's serve, pb = chance p2 wins a point on p2's serve
  const noad = cfg.scoring==="no_ad";
  const mh={}, mt={}, ms={}, mm={};
  function hold(p,a,b){
    const k=p+"|"+a+"|"+b; if(k in mh) return mh[k];
    let r;
    if(noad){ if(a>=4) r=1; else if(b>=4) r=0; else if(a===3&&b===3) r=p; }
    if(r===undefined){
      if(a>=4&&a-b>=2) r=1; else if(b>=4&&b-a>=2) r=0;
      else if(a>=3&&b>=3){ const d=p*p/(p*p+(1-p)*(1-p)); r = a===b ? d : (a>b ? p+(1-p)*d : p*d); }
      else r = p*hold(p,a+1,b)+(1-p)*hold(p,a,b+1);
    }
    return mh[k]=r;
  }
  const hA=hold(pa,0,0), hB=hold(pb,0,0);
  function tbServer(n, first){ return n===0 ? first : (Math.floor((n-1)/2)%2===0 ? wpOther(first) : first); }
  function tb(a,b,first,target){
    const k=a+"|"+b+"|"+first+"|"+target; if(k in mt) return mt[k];
    let r;
    if(a>=target&&a-b>=2) r=1; else if(b>=target&&b-a>=2) r=0;
    else {
      const q = tbServer(a+b, first)==="p1" ? pa : 1-pb;
      if(a>=target-1&&b>=target-1){
        const w=pa*(1-pb), l=(1-pa)*pb, tie=w/(w+l);
        r = a===b ? tie : (a>b ? q+(1-q)*tie : q*tie);
      } else r = q*tb(a+1,b,first,target)+(1-q)*tb(a,b+1,first,target);
    }
    return mt[k]=r;
  }
  function setw(g1,g2,srv){
    const k=g1+"|"+g2+"|"+srv; if(k in ms) return ms[k];
    let r;
    if((g1>=6&&g1-g2>=2)||g1>=7) r=1;
    else if((g2>=6&&g2-g1>=2)||g2>=7) r=0;
    else if(g1===6&&g2===6) r=tb(0,0,srv,7);
    else { const h = srv==="p1" ? hA : 1-hB; r = h*setw(g1+1,g2,wpOther(srv))+(1-h)*setw(g1,g2+1,wpOther(srv)); }
    return ms[k]=r;
  }
  function match(s1,s2){
    if(s1>=2) return 1; if(s2>=2) return 0;
    const k=s1+"|"+s2; if(k in mm) return mm[k];
    const decider = s1===1&&s2===1&&cfg.thirdSet==="match_tiebreak_10";
    const s = decider ? (tb(0,0,"p1",10)+tb(0,0,"p2",10))/2 : (setw(0,0,"p1")+setw(0,0,"p2"))/2;
    return mm[k] = s*match(s1+1,s2)+(1-s)*match(s1,s2+1);
  }
  function fromStart(firstServer){ const s=setw(0,0,firstServer); return s*match(1,0)+(1-s)*match(0,1); }
  function fromState(st){
    if(st.over) return st.winner==="p1" ? 1 : 0;
    const s1=st.setsWon[0], s2=st.setsWon[1];
    let w;
    if(st.mtb) w = tb(st.p[0],st.p[1],st.tbFirst,10);
    else if(st.tb) w = tb(st.p[0],st.p[1],st.tbFirst,7);
    else {
      const srv=st.curServer, a = srv==="p1"?st.p[0]:st.p[1], b = srv==="p1"?st.p[1]:st.p[0];
      const h = hold(srv==="p1"?pa:pb, a, b), pw = srv==="p1" ? h : 1-h;
      w = pw*setw(st.g[0]+1,st.g[1],wpOther(srv)) + (1-pw)*setw(st.g[0],st.g[1]+1,wpOther(srv));
    }
    return w*match(s1+1,s2)+(1-w)*match(s1,s2+1);
  }
  return { fromStart, fromState };
}
const wpCache = new Map();
function wpGet(pa,pb,cfg){
  const R=20000, ra=Math.round(pa*R)/R, rb=Math.round(pb*R)/R;
  const k=ra+"|"+rb+"|"+cfg.scoring+"|"+cfg.thirdSet;
  let m=wpCache.get(k);

    el.querySelector("#let-net").onclick=()=>{ push({type:"let"}); closeSheet(); toast("Let · replay the serve"); render(); };
    el.querySelector("#let-replay").onclick=()=>{ push({type:"replay"}); ui.step="serve"; ui.pendingWinner=null; closeSheet(); toast("Replay the point · 1st serve"); render(); };
  }); };
$("board").onclick=()=>openFix();
$("btn-note").onclick=()=>{ const st=compute(match);
  sheet(`<h2>Note · Set ${st.setIdx+1} · ${st.g[0]}-${st.g[1]} · ${esc(st.scoreStr)}</h2><p style="margin:0;color:var(--muted);font-size:14px">Anything the coach should know about right now. Goes in the report at this score.</p><textarea id="note-text" rows="3" style="width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)" placeholder="e.g. started rushing 2nd serves, looked tired"></textarea><button class="big primary" id="note-save" style="font-size:20px">Save note</button>`, el=>{ const ta=el.querySelector("#note-text"); ta.focus(); el.querySelector("#note-save").onclick=()=>{ const t=ta.value.trim(); if(t){ push({type:"note",text:t}); toast("Note saved"); } closeSheet(); render(); }; });
};
$("btn-end").onclick=()=>openSummary();
$("btn-endmatch").onclick=()=>sheet(`<h2>End the match here?</h2><p style="margin:0;color:var(--muted)">Use this if the match stopped early (retirement, time limit) or you're done charting. Stats stay as they are. You can't go back to scoring after this.</p><button class="big close" id="end-yes" style="font-size:20px">End match</button>`, el=>{ el.querySelector("#end-yes").onclick=()=>{ match.ended=true; save(); closeSheet(); openSummary(); toast("Match ended"); }; });

/* Fix score */
function openFix(){
  const st=compute(match);
  if (st.over) return;
  const tbNote = st.inTiebreak ? `<p class="warnrow">In a tiebreak: fix the games only. Use Undo for tiebreak points.</p>` : "";
  const ptOpts = v => ["0","15","30","40","AD"].map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("");
  sheet(`<h2>Fix the score</h2>${tbNote}
    <div class="fields">
      <div><label>${esc(match.p1Name)} games</label><input type="number" inputmode="numeric" id="fx-g1" value="${st.g[0]}" min="0" max="7"></div>
      <div><label>${esc(match.p2Name)} games</label><input type="number" inputmode="numeric" id="fx-g2" value="${st.g[1]}" min="0" max="7"></div>
      <div><label>${esc(match.p1Name)} points</label><select id="fx-p1">${ptOpts(st.disp[0])}</select></div>
      <div><label>${esc(match.p2Name)} points</label><select id="fx-p2">${ptOpts(st.disp[1])}</select></div>
      <div style="grid-column:1/-1"><label>Who is serving</label><div class="seg"><button id="fx-s1" aria-pressed="${st.curServer==="p1"}">${esc(match.p1Name)}</button><button id="fx-s2" aria-pressed="${st.curServer==="p2"}">${esc(match.p2Name)}</button></div></div>
    </div>
    <button class="big primary" id="fx-save" style="font-size:20px">Save score</button>
    <button class="big ghost" id="fx-unsure" style="font-size:18px">Not sure, just mark it and keep going</button>`, el=>{
    let srv=st.curServer;
    el.querySelector("#fx-s1").onclick=()=>{srv="p1";el.querySelector("#fx-s1").setAttribute("aria-pressed","true");el.querySelector("#fx-s2").setAttribute("aria-pressed","false");};
    el.querySelector("#fx-s2").onclick=()=>{srv="p2";el.querySelector("#fx-s2").setAttribute("aria-pressed","true");el.querySelector("#fx-s1").setAttribute("aria-pressed","false");};
    el.querySelector("#fx-save").onclick=()=>{
      const e={type:"fix_score", unsure:false, games:[+el.querySelector("#fx-g1").value||0, +el.querySelector("#fx-g2").value||0], server:srv};
      if(!st.inTiebreak) e.points=[el.querySelector("#fx-p1").value, el.querySelector("#fx-p2").value];
      push(e); ui.step="serve"; ui.chips=false; closeSheet(); toast("Score fixed"); render();
    };
    el.querySelector("#fx-unsure").onclick=()=>{ push({type:"fix_score",unsure:true}); ui.step="serve"; ui.chips=false; closeSheet(); toast("Marked. Coach will see a ⚠ here."); render(); };
  });
}

/* Point log + edit */
function pointText(p){
  if (p.how==="double_fault") return `${name(p.server)} double fault`;
  const hitter = p.how==="winner"?p.winner:other(p.winner);
  const ace = p.how==="winner"&&p.shot==="serve"&&p.winner===p.server;
  return `${name(hitter)} ${ace?"ace":HOWLABEL[p.how].toLowerCase()}${p.shot&&!ace?" · "+SHOTLABEL[p.shot]:""}${p.rally?" · "+p.rally+" rally":""}`;
}
function pointRows(st){
  // computed points line up with point events and second-serve faults, in order
  const rows=[]; let pi=0; let sn=1;
  for (let i=0;i<match.events.length;i++){
    const e=match.events[i];
    if (e.type==="serve_fault"){ if(sn===1){sn=2;} else { rows.push({p:st.points[pi++], i, df:true}); sn=1; } }
    else if (e.type==="point"){ rows.push({p:st.points[pi++], i}); sn=1; }
    else if (e.type==="fix_score"){ sn=1; }
    if (pi>st.points.length) break;
  }
  return rows;
}
function editPoint(i,row){
  const e=match.events[i];
  if (row.df){
    sheet(`<h2>Double fault at ${esc(row.p.before)}</h2><button class="big ghost" id="del">Delete this fault</button>`, el=>{ el.querySelector("#del").onclick=()=>{ match.events.splice(i,1); save(); closeSheet(); if($("s-summary").hidden) render(); else renderSummary(); toast("Deleted"); }; });
    return;
  }
  // find following shot / rally events that belong to this point
  let shotIdx=-1, rallyIdx=-1; for(let k=i+1;k<match.events.length;k++){ const t=match.events[k].type; if(t==="shot"&&shotIdx<0){shotIdx=k;continue;} if(t==="rally"&&rallyIdx<0){rallyIdx=k;continue;} if(t==="point"||t==="serve_in"||t==="serve_fault") break; }
  const curShot = shotIdx>=0?match.events[shotIdx].shot:(e.shot||null);
  const curRally = rallyIdx>=0?match.events[rallyIdx].rally:null;
  const dropExtras=()=>{ [shotIdx,rallyIdx].filter(x=>x>=0).sort((a,b)=>b-a).forEach(x=>match.events.splice(x,1)); };
  const segBtn=(id,pressed,label)=>`<button id="${id}" aria-pressed="${pressed}">${label}</button>`;
  sheet(`<h2>Point at ${esc(row.p.before)}</h2>
    <div class="eyebrow">Who won</div><div class="seg">${segBtn("e-w1",e.winner==="p1",esc(match.p1Name))}${segBtn("e-w2",e.winner==="p2",esc(match.p2Name))}</div>
    <div class="eyebrow">How</div><div class="seg">${segBtn("e-hw",e.how==="winner","Winner")}${segBtn("e-hf",e.how==="forced_error","Forced")}${segBtn("e-hu",e.how==="unforced_error","Unforced")}</div>
    <div class="eyebrow">Shot</div><div class="chips" id="e-chips"></div>
    <div class="eyebrow">Rally</div><div class="chips" id="e-rally"></div>
    <button class="big primary" id="e-save" style="font-size:20px">Save changes</button>
    <button class="big ghost" id="e-del" style="font-size:18px;color:var(--warn)">Delete this point</button>`, el=>{
    let w=e.winner, how=e.how, shot=curShot, rally=curRally;
    const rc=el.querySelector("#e-rally");
    Object.keys(RALLYLABEL).forEach(k=>{ const b=document.createElement("button"); b.textContent=RALLYLABEL[k]; b.setAttribute("aria-pressed",String(rally===k)); b.onclick=()=>{ rally = rally===k?null:k; rc.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.textContent===RALLYLABEL[rally]))); }; rc.appendChild(b); });
    const press=(ids,on)=>ids.forEach(id=>el.querySelector("#"+id).setAttribute("aria-pressed",String(id===on)));
    el.querySelector("#e-w1").onclick=()=>{w="p1";press(["e-w1","e-w2"],"e-w1");};
    el.querySelector("#e-w2").onclick=()=>{w="p2";press(["e-w1","e-w2"],"e-w2");};
    el.querySelector("#e-hw").onclick=()=>{how="winner";press(["e-hw","e-hf","e-hu"],"e-hw");};
    el.querySelector("#e-hf").onclick=()=>{how="forced_error";press(["e-hw","e-hf","e-hu"],"e-hf");};
    el.querySelector("#e-hu").onclick=()=>{how="unforced_error";press(["e-hw","e-hf","e-hu"],"e-hu");};
    const c=el.querySelector("#e-chips");
    Object.keys(SHOTLABEL).forEach(k=>{ const b=document.createElement("button"); b.textContent=SHOTLABEL[k]; b.setAttribute("aria-pressed",String(shot===k)); b.onclick=()=>{ shot = shot===k?null:k; c.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.textContent===SHOTLABEL[shot]))); }; c.appendChild(b); });
    const after=()=>{ save(); closeSheet(); if($("s-summary").hidden) render(); else renderSummary(); };
    el.querySelector("#e-save").onclick=()=>{ dropExtras(); e.winner=w; e.how=how; e.shot=shot; if(rally) match.events.splice(i+1,0,{type:"rally",rally,id:uid(),ts:Date.now()}); after(); toast("Updated"); };
    el.querySelector("#e-del").onclick=()=>{ dropExtras(); match.events.splice(i,1); after(); toast("Deleted"); };
  });
}

/* ---- Summary ---- */
function elapsed(ts){ const m=Math.max(0,Math.round((ts-match.createdAt)/60000)); return m<60?`${m} min in`:`${Math.floor(m/60)}h ${m%60}m in`; }
function pct(a){ return a[1]?`${Math.round(100*a[0]/a[1])}% <small style="opacity:.75">${a[0]}/${a[1]}</small>`:`0`; }
function openSummary(){ ui.tab=null; show("s-summary"); renderSummary(); }
function renderSummary(){
  const st=compute(match);
  const setCount = Math.max(st.sets.length + (st.over?0:1), 1);
  const S=computeStats(match, st, ui.tab);
  const setScore = st.sets.map(s=> s.mtb ? `${s.tb[0]}–${s.tb[1]}` : `${s.games[0]}–${s.games[1]}${s.tb?` (${Math.min(...s.tb)})`:""}`).join("  ");
  const curPts = st.inTiebreak ? `${st.p[0]}–${st.p[1]}` : `${st.disp[0]}–${st.disp[1]}`;
  const live = !st.over ? `${setScore?"  ":""}${st.mtb?"":st.g[0]+"–"+st.g[1]}<small style="display:block;font-size:14px;opacity:.85;letter-spacing:.1em">${st.mtb?"Match TB ":""}${curPts} now</small>` : "";
  const fields = `<div class="fields">
    <div><label>${esc(match.p1Name)} UTR</label><input id="u1" inputmode="decimal" placeholder="optional" value="${match.p1Utr||""}"></div>
    <div><label>${esc(match.p2Name)} UTR</label><input id="u2" inputmode="decimal" placeholder="optional" value="${match.p2Utr||""}"></div>
    <div><label>Tournament</label><input id="tour" placeholder="optional" value="${esc(match.tournament||"")}"></div>
    <div><label>Surface</label><input id="surf" placeholder="hard / clay" value="${esc(match.surface||"")}"></div>
  </div>`;
  const allPts = st.points.filter(p=>ui.tab==null||p.setIdx===ui.tab);
  const km = allPts.filter(p=>p.bp||p.sp||p.mp).map(p=>`<div class="item km-item" style="display:grid"><span class="tag">${p.mp?"Match pt":p.sp?"Set pt":"Break pt"} · Set ${p.setIdx+1}</span><span class="ev">${esc(p.before)} · ${esc(pointText(p))}</span><span class="tag">${p.winner==="p1"?esc(match.p1Name):esc(match.p2Name)}</span></div>`).join("") || `<p style="color:var(--muted);margin:0">None yet.</p>`;
  const tabs = [`<button aria-pressed="${ui.tab==null}" data-t="">Match</button>`].concat(Array.from({length:setCount},(_,i)=>`<button aria-pressed="${ui.tab===i}" data-t="${i}">Set ${i+1}</button>`)).join("");
  const row=(label,a,b,kind,sub,key)=>{
    let va,vb,la,lb;
    if(kind==="pct"){ va=a[1]?a[0]/a[1]:0; vb=b[1]?b[0]/b[1]:0; la=pct(a); lb=pct(b); }
    else { const t=a+b; va=t?a/t:0; vb=t?b/t:0; la=a; lb=b; }
    return `<div class="srow ${sub?"sub":""} ${key?"clickable":""}" ${key?`data-k="${key}"`:""}><div class="v l"><span class="num">${la}</span><span class="bar"><i style="width:${Math.round(va*100)}%"></i></span></div><div class="lab">${label}</div><div class="v r"><span class="num">${lb}</span><span class="bar"><i style="width:${Math.round(vb*100)}%"></i></span></div></div>`;
  };
  const shotRows=(key,field)=>{ if(!ui.expand[key]) return ""; return Object.keys(SHOTLABEL).map(s=>row(SHOTLABEL[s], S.p1[field].m[s], S.p2[field].m[s], "n", true)).join(""); };
  const stats=`<div class="stats">
    <div class="head"><div class="nm"><span class="av p1">${esc(match.p1Name[0]||"P")}</span><span>${esc(match.p1Name)}</span></div><div class="eyebrow" style="text-align:center">${ui.tab==null?"Match":"Set "+(ui.tab+1)}</div><div class="nm r"><span>${esc(match.p2Name)}</span><span class="av p2">${esc(match.p2Name[0]||"O")}</span></div></div>
    <div class="sec"><span class="n">${esc(match.p1Name)}</span><span>Serve</span><span class="n r">${esc(match.p2Name)}</span></div>
    ${row("Aces",S.p1.aces,S.p2.aces,"n")}
    ${row("Double faults",S.p1.df,S.p2.df,"n")}
    ${row("1st serve in",S.p1.firstIn,S.p2.firstIn,"pct")}
    ${row("1st serve pts won",S.p1.firstWon,S.p2.firstWon,"pct")}
    ${row("2nd serve pts won",S.p1.secondWon,S.p2.secondWon,"pct")}
    ${row("Break pts saved",S.p1.bpSaved,S.p2.bpSaved,"pct")}
    ${row("Service games",S.p1.serviceGames,S.p2.serviceGames,"n")}
    <div class="sec"><span class="n">${esc(match.p1Name)}</span><span>Return</span><span class="n r">${esc(match.p2Name)}</span></div>
    ${row("1st serve return pts won",S.p1.r1Won,S.p2.r1Won,"pct")}
    ${row("2nd serve return pts won",S.p1.r2Won,S.p2.r2Won,"pct")}
    ${row("Break pts converted",S.p1.bpConv,S.p2.bpConv,"pct")}
    ${row("Return games",S.p1.returnGames,S.p2.returnGames,"n")}
    <div class="sec"><span class="n">${esc(match.p1Name)}</span><span>Points</span><span class="n r">${esc(match.p2Name)}</span></div>
    ${row("Net pts won (approx)",S.p1.netWon,S.p2.netWon,"pct")}
    ${row("Winners ▾",S.p1.winners.tot,S.p2.winners.tot,"n",false,"winners")}${shotRows("winners","winners")}
    ${row("Forced errors ▾",S.p1.fe.tot,S.p2.fe.tot,"n",false,"fe")}${shotRows("fe","fe")}
    ${row("Unforced errors ▾",S.p1.ue.tot,S.p2.ue.tot,"n",false,"ue")}${shotRows("ue","ue")}
    ${row("Service pts won",S.p1.servePtsWon,S.p2.servePtsWon,"pct")}
    ${row("Return pts won",S.p1.returnPtsWon,S.p2.returnPtsWon,"pct")}
    ${row("Total pts won",S.p1.totalWon,S.p2.totalWon,"pct")}
    <div class="sec"><span class="n">${esc(match.p1Name)}</span><span>Rally length</span><span class="n r">${esc(match.p2Name)}</span></div>
    ${row("Short (1–4) won",S.p1.rallyShort,S.p2.rallyShort,"pct")}
    ${row("Medium (5–8) won",S.p1.rallyMed,S.p2.rallyMed,"pct")}
    ${row("Long (9+) won",S.p1.rallyLong,S.p2.rallyLong,"pct")}
  </div>`;
  const marks = st.markers.filter(m=>m.kind==="unsure"&&(ui.tab==null||m.setIdx===ui.tab));
  const noteMarks = st.markers.filter(m=>m.kind==="note"&&(ui.tab==null||m.setIdx===ui.tab));
  const rows = pointRows(st);
  const timeline = rows.filter(r=>ui.tab==null||r.p.setIdx===ui.tab).map(r=>{ const p=r.p; return `<button class="item" data-i="${r.i}"><span class="sc">${esc(p.before)}</span><span class="ev">${esc(pointText(p))}${p.unsure?' <span class="warnrow">⚠ score may be off here</span>':""}</span><span class="tag">${p.serveNum===2?"2nd":"1st"}${p.bp?" · BP":""}</span></button>`; }).join("");
  $("summary").innerHTML=`
    <div class="final"><div class="n">${esc(match.p1Name)}</div><div class="s" style="grid-row:1/3;align-self:center">${setScore}${live}</div><div class="n">${esc(match.p2Name)}</div>
      <div class="w" style="grid-column:1/-1">${st.over?`${esc(name(st.winner))} wins`:match.ended?"Ended early":"Match in progress"} · ${match.config.scoring==="ad"?"Ad":"No-ad"} · ${match.config.thirdSet==="full_set"?"Full 3rd set":"10-pt match TB"}</div></div>
    ${!st.over&&!match.ended?`<div class="row"><button class="big backbtn" id="back-live" style="font-size:20px">← Back to scoring</button><button class="big close" id="end-match" style="font-size:20px">End match</button></div>`:""}
    <div class="tabs" id="tabs">${tabs}</div>
    <div><h2>Match stats</h2></div>
    ${stats}
    ${marks.length?`<p class="warnrow">⚠ Parent lost track ${marks.length} time${marks.length>1?"s":""} this ${ui.tab==null?"match":"set"}. Score may be off near those points.</p>`:""}
    <div><h2>Key moments</h2><div class="km list" style="margin-top:8px">${km}</div></div>
    ${fields}
    <div><h2>Every point</h2><p style="margin:4px 0 0;color:var(--muted);font-size:13px">Tap a point to change or delete it.</p><div class="list" style="margin-top:8px">${timeline||'<p style="color:var(--muted);margin:0">No points.</p>'}</div></div>
    <div><h2>Notes</h2><div class="list" style="margin-top:8px">${noteMarks.map(n=>`<div class="item" style="display:grid;grid-template-columns:1fr"><span class="tag">Set ${n.setIdx+1} · ${esc(n.games)} · ${esc(n.before)} · ${elapsed(n.ts)}</span><span class="ev">${esc(n.text)}</span></div>`).join("")||'<p style="color:var(--muted);margin:0">No notes yet.</p>'}</div>
      <div class="row" style="margin-top:8px;align-items:stretch"><textarea id="add-note" rows="2" placeholder="Add a note for the coach" style="flex:3;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)"></textarea><button class="big primary" id="add-note-btn" style="flex:1;font-size:18px;min-height:0">Add</button></div></div>
`;
  $("summary").querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ ui.tab=b.dataset.t===""?null:+b.dataset.t; renderSummary(); });
  $("summary").querySelectorAll(".srow.clickable").forEach(r=>r.onclick=()=>{ ui.expand[r.dataset.k]=!ui.expand[r.dataset.k]; renderSummary(); });
  $("summary").querySelectorAll(".list .item[data-i]").forEach(b=>b.onclick=()=>editPoint(+b.dataset.i, rows.find(r=>r.i===+b.dataset.i)));
  const bind=(id,key,num)=>{ const el=$(id); el.onchange=()=>{ match[key]= num ? (parseFloat(el.value)||undefined) : el.value.trim(); save(); }; };
  bind("u1","p1Utr",true); bind("u2","p2Utr",true); bind("tour","tournament",false); bind("surf","surface",false);
  const bl=$("summary").querySelector("#back-live"); if(bl) bl.onclick=()=>{ show("s-live"); render(); };
  const em=$("summary").querySelector("#end-match"); if(em) em.onclick=()=>sheet(`<h2>End the match here?</h2><p style="margin:0;color:var(--muted)">Use this if the match stopped early (retirement, time limit) or you're done charting. Stats stay as they are. You can't go back to scoring after this.</p><button class="big close" id="end-yes" style="font-size:20px">End match</button>`, el=>{ el.querySelector("#end-yes").onclick=()=>{ match.ended=true; save(); closeSheet(); renderSummary(); toast("Match ended"); }; });
  $("add-note-btn").onclick=()=>{ const t=$("add-note").value.trim(); if(!t) return; push({type:"note",text:t}); renderSummary(); toast("Note added"); };
}

/* ---- Report text ---- */
function reportText(){
  const st=compute(match); const S=computeStats(match,st,null);
  const P=(a)=>a[1]?`${Math.round(100*a[0]/a[1])}% (${a[0]}/${a[1]})`:"0";
  const n1=match.p1Name, n2=match.p2Name;
  const score = st.sets.map(s=>s.mtb?`${s.tb[0]}-${s.tb[1]}`:`${s.games[0]}-${s.games[1]}${s.tb?`(${Math.min(...s.tb)})`:""}`).join(" ");
  const cur = st.over ? "" : ` ${st.mtb?"":st.g[0]+"-"+st.g[1]} (${st.inTiebreak?st.p[0]+"-"+st.p[1]:st.disp[0]+"-"+st.disp[1]} now)`;
  const L=[];
  L.push(`🎾 MATCH REPORT · ${new Date(match.createdAt).toLocaleDateString(undefined,{month:"short",day:"numeric"})}`);
  L.push(st.over ? `${name(st.winner)} def. ${name(other(st.winner))}  ${score}` : `${n1} vs ${n2}  ${score}${cur}${match.ended?" · ended early":""}`);
  const meta=[]; if(match.tournament) meta.push(match.tournament); if(match.surface) meta.push(match.surface);
  if(match.p1Utr||match.p2Utr) meta.push(`UTR ${match.p1Utr||"?"} vs ${match.p2Utr||"?"}`);
  meta.push(match.config.scoring==="ad"?"Ad":"No-ad"); if(meta.length) L.push(meta.join(" · "));
  L.push(""); L.push(`Stats shown as ${n1} | ${n2}`);
  const r=(label,a,b)=>L.push(`${label}: ${a} | ${b}`);
  L.push(""); L.push("🎾 SERVE");
  r("Aces",S.p1.aces,S.p2.aces); r("Double faults",S.p1.df,S.p2.df);
  r("1st serve in",P(S.p1.firstIn),P(S.p2.firstIn)); r("1st serve pts won",P(S.p1.firstWon),P(S.p2.firstWon)); r("2nd serve pts won",P(S.p1.secondWon),P(S.p2.secondWon));
  r("Break pts saved",P(S.p1.bpSaved),P(S.p2.bpSaved));
  L.push(""); L.push("🔁 RETURN");
  r("1st serve return won",P(S.p1.r1Won),P(S.p2.r1Won)); r("2nd serve return won",P(S.p1.r2Won),P(S.p2.r2Won)); r("Break pts converted",P(S.p1.bpConv),P(S.p2.bpConv));
  L.push(""); L.push("🎯 POINTS");
  const bs=x=>Object.keys(SHOTLABEL).filter(k=>x.m[k]).map(k=>`${SHOTLABEL[k]} ${x.m[k]}`).join(", ");
  const shotLine=(label,f)=>{ r(label,S.p1[f].tot,S.p2[f].tot); const a=bs(S.p1[f]), b=bs(S.p2[f]); if(a) L.push(`   ${n1}: ${a}`); if(b) L.push(`   ${n2}: ${b}`); };
  shotLine("Winners","winners"); shotLine("Forced errors","fe"); shotLine("Unforced errors","ue");
  r("Net pts won (approx)",P(S.p1.netWon),P(S.p2.netWon));
  r("Service pts won",P(S.p1.servePtsWon),P(S.p2.servePtsWon)); r("Return pts won",P(S.p1.returnPtsWon),P(S.p2.returnPtsWon)); r("Total pts won",P(S.p1.totalWon),P(S.p2.totalWon));
  if (S.p1.rallyShort[1]+S.p1.rallyMed[1]+S.p1.rallyLong[1]){
    L.push(""); L.push("⏱ RALLY LENGTH (pts won)");
    r("Short 1–4",P(S.p1.rallyShort),P(S.p2.rallyShort)); r("Medium 5–8",P(S.p1.rallyMed),P(S.p2.rallyMed)); r("Long 9+",P(S.p1.rallyLong),P(S.p2.rallyLong));
  }
  const km=st.points.filter(p=>p.bp||p.sp||p.mp);
  if(km.length){ L.push(""); L.push("⭐ KEY MOMENTS");
    km.forEach(p=>L.push(`Set ${p.setIdx+1} · ${p.before} ${p.mp?"MP":p.sp?"SP":"BP"} → ${pointText(p)}`)); }
  const notes=st.markers.filter(m=>m.kind==="note");
  if(notes.length){ L.push(""); L.push("📝 NOTES");
    notes.forEach(n=>L.push(`Set ${n.setIdx+1} · ${n.games} · ${n.before} · ${elapsed(n.ts)}: ${n.text}`)); }
  const unsure=st.markers.filter(m=>m.kind==="unsure").length;
  if(unsure) { L.push(""); L.push(`⚠️ Score may be off in ${unsure} spot${unsure>1?"s":""} (parent lost track).`); }
  L.push(""); L.push("Charted with TennisChart");
  return L.join("\n");
}
/* ---- Report image (canvas) ---- */
async function reportImage(){

    ["POINTS",[["Net pts won (approx)",S.p1.netWon,S.p2.netWon,"pct"],["Winners",S.p1.winners.tot,S.p2.winners.tot,"n"],["Forced errors",S.p1.fe.tot,S.p2.fe.tot,"n"],["Unforced errors",S.p1.ue.tot,S.p2.ue.tot,"n"],["Service pts won",S.p1.servePtsWon,S.p2.servePtsWon,"pct"],["Return pts won",S.p1.returnPtsWon,S.p2.returnPtsWon,"pct"],["Total pts won",S.p1.totalWon,S.p2.totalWon,"pct"]]],
  ];
  if (S.p1.rallyShort[1]+S.p1.rallyMed[1]+S.p1.rallyLong[1]) sections.push(["RALLY LENGTH · PTS WON",[["Short (1–4)",S.p1.rallyShort,S.p2.rallyShort,"pct"],["Medium (5–8)",S.p1.rallyMed,S.p2.rallyMed,"pct"],["Long (9+)",S.p1.rallyLong,S.p2.rallyLong,"pct"]]]);
  const bs=x=>Object.keys(SHOTLABEL).filter(k=>x.m[k]).map(k=>`${SHOTLABEL[k]} ${x.m[k]}`).join(", ");
  const shotLines=[["Winners",bs(S.p1.winners),bs(S.p2.winners)],["Forced errors",bs(S.p1.fe),bs(S.p2.fe)],["Unforced errors",bs(S.p1.ue),bs(S.p2.ue)]].filter(x=>x[1]||x[2]);
  const km=st.points.filter(p=>p.bp||p.sp||p.mp);
  const notes=st.markers.filter(m=>m.kind==="note");
  const rows=sections.reduce((a,sec)=>a+sec[1].length,0);

  mc.font="500 20px 'Barlow', system-ui, sans-serif";
  const kmLines = km.map(p=>wrap(mc,pointText(p),W-2*pad-330));
  const noteLines = notes.map(n=>wrap(mc,n.text,W-2*pad));
  const shotH = shotLines.reduce((a,x)=>a+ (wrap(mc,`${n1}: ${x[1]||"–"}`,W-2*pad-230).length+wrap(mc,`${n2}: ${x[2]||"–"}`,W-2*pad-230).length)*26+8, 0);
  const H = 300 + sections.length*secH + rows*rowH + (shotLines.length?60+shotH:0) + (km.length?70+kmLines.reduce((a,l)=>a+22+l.length*26,0):0) + (notes.length?70+noteLines.reduce((a,l)=>a+30+l.length*26,0):0) + 80;
  const c=document.createElement("canvas"); c.width=W; c.height=Math.min(H+600,15000); const g=c.getContext("2d");
  g.fillStyle=BG; g.fillRect(0,0,W,H);

  const fit=(t,max)=>{ while(g.measureText(t).width>max && t.length>2) t=t.slice(0,-2)+"…"; return t; };
  // header band
  g.fillStyle=BAND; g.fillRect(0,0,W,210); g.fillStyle=ACC; g.fillRect(0,204,W,6);
  g.fillStyle=ACC; D("700",30); g.textAlign="left"; g.fillText("MATCH REPORT", pad, 54);
  F("600",22); g.fillStyle="rgba(255,255,255,.85)"; g.textAlign="right"; g.fillText(new Date(match.createdAt).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}), W-pad, 54);
  const score = st.sets.map(x=>x.mtb?`${x.tb[0]}–${x.tb[1]}`:`${x.games[0]}–${x.games[1]}${x.tb?` (${Math.min(...x.tb)})`:""}`).join("   ") + (st.over?"":`   ${st.mtb?"":st.g[0]+"–"+st.g[1]}`);
  D("700",58); g.textAlign="center"; g.fillStyle="#fff"; g.fillText(score||"0–0", W/2, 130);
  F("700",24); g.fillStyle="#fff"; g.textAlign="left"; g.fillText(fit(n1.toUpperCase(),380), pad, 180);
  g.textAlign="right"; g.fillText(fit(n2.toUpperCase(),380), W-pad, 180);
  const sub = st.over?`${name(st.winner)} wins`:match.ended?"Ended early":"In progress";
  const meta=[sub]; if(match.tournament) meta.push(match.tournament); if(match.p1Utr||match.p2Utr) meta.push(`UTR ${match.p1Utr||"?"} vs ${match.p2Utr||"?"}`); meta.push(match.config.scoring==="ad"?"Ad":"No-ad");
  F("600",20); g.textAlign="center"; g.fillStyle="rgba(255,255,255,.85)"; g.fillText(meta.join("  ·  "), W/2, 130+40);
  // legend
  let y=250;
  g.fillStyle=ME; g.fillRect(pad,y-18,26,26); F("700",22); g.fillStyle=INK; g.textAlign="left"; g.fillText(n1, pad+38, y+2);
  g.textAlign="right"; g.fillStyle=INK; g.fillText(n2, W-pad-38, y+2); g.fillStyle=OPP; g.fillRect(W-pad-26,y-18,26,26);
  y+=40;
  const val=(v,k)=> k==="pct" ? (v[1]?`${Math.round(100*v[0]/v[1])}%  ${v[0]}/${v[1]}`:"0") : String(v);
  const frac=(v,k,o)=> k==="pct" ? (v[1]?v[0]/v[1]:0) : ((v+o)?v/(v+o):0);
  for (const [title,list] of sections){
    g.fillStyle=BAND; g.fillRect(pad,y,W-2*pad,secH-14); g.fillStyle=ACC; g.fillRect(pad,y+secH-18,W-2*pad,4);
    D("700",28); g.fillStyle="#fff"; g.textAlign="center"; g.fillText(title, W/2, y+40);
    F("700",18); g.fillStyle="rgba(255,255,255,.9)"; g.textAlign="left"; g.fillText(fit(n1,250), pad+18, y+38); g.textAlign="right"; g.fillText(fit(n2,250), W-pad-18, y+38);
    y+=secH;
    for (const [label,a,b,k] of list){
      g.fillStyle=SOFT; g.fillRect(W/2-colC/2, y, colC, rowH-10);
      F("700",17); g.fillStyle=INK; g.textAlign="center"; g.fillText(label.toUpperCase(), W/2, y+39);
      const barMax = W/2-colC/2-pad-150;

      g.fillStyle=MEb; g.fillRect(pad+140+barMax*(1-fa), y+21, barMax*fa, barH);
      g.fillStyle=OPP; g.fillRect(W/2+colC/2+10, y+21, barMax*fb, barH);
      F("700",22); g.fillStyle=INK; g.textAlign="left"; g.fillText(val(a,k), pad, y+40);
      g.textAlign="right"; g.fillText(val(b,k), W-pad, y+40);
      g.fillStyle=LINE; g.fillRect(pad, y+rowH-8, W-2*pad, 2);
      y+=rowH;
    }
  }
  const h2=t=>{ y+=24; D("700",30); g.fillStyle=INK; g.textAlign="left"; g.fillText(t, pad, y+10); y+=34; };

  y+=40; F("600",16); g.fillStyle=MUTED; g.textAlign="center"; g.fillText("Charted with TennisChart", W/2, y+16); y+=50;
  const out=document.createElement("canvas"); out.width=W; out.height=Math.min(y,c.height); out.getContext("2d").drawImage(c,0,0);

}
function canvasBlob(c){ return new Promise(res=>c.toBlob(b=>res(b),"image/png")); }
$("btn-image").onclick=()=>{

};
$("btn-new").onclick=()=>{
  sheet(`<h2>Start a new match?</h2><p style="margin:0;color:var(--muted)">This match is not saved. Copy the report first if you need it.</p><button class="big primary" id="new-yes">New match</button>`, el=>{ el.querySelector("#new-yes").onclick=()=>{ const last=match.p1Name; try{ localStorage.setItem("mc_prev", JSON.stringify(match)); }catch(x){} match=null; save(); closeSheet(); $("p2name").value=""; $("p1name").value=""; $("p1utr").value=""; $("p2utr").value=""; try{ localStorage.setItem("mc_lastp1", last); }catch(e){} const b=$("p1last"); if(last){ b.textContent="Use "+last; b.hidden=false; b.onclick=()=>{ $("p1name").value=last; b.hidden=true; }; } show("s-setup"); showRestore(); utrNote(); }; });

function showRestore(){ let prev=null; try{ prev=JSON.parse(localStorage.getItem("mc_prev")||"null"); }catch(x){} const b=$("btn-restore"); if(prev&&prev.events){ b.hidden=false; b.textContent=`↩ Reopen last match (${prev.p1Name} vs ${prev.p2Name})`; b.onclick=()=>{ match=prev; try{ localStorage.removeItem("mc_prev"); }catch(x){} save(); b.hidden=true; if(match.ended||compute(match).over) openSummary(); else { show("s-live"); render(); } }; } else b.hidden=true; }

load(); utrNote();
if (match && match.events){ if(match.ended){ openSummary(); } else { show("s-live"); render(); } } else { show("s-setup"); showRestore(); }

<script type="module">
  // Native bridge: haptics and status bar when running inside the iOS app; no-ops in a browser.
  try {
    const cap = window.Capacitor;
    if (cap && cap.isNativePlatform && cap.isNativePlatform()) {
      const { Haptics, ImpactStyle, NotificationType } = cap.Plugins;
      window.__haptic = (kind) => {
        try {
          if (kind === "point") Haptics.impact({ style: ImpactStyle.Medium });
          else if (kind === "game") Haptics.notification({ type: NotificationType.Success });
          else Haptics.impact({ style: ImpactStyle.Light });
        } catch (e) {}
      };
      const { StatusBar, Style } = cap.Plugins;
      window.__statusbar = (sun) => { try { StatusBar.setStyle({ style: sun ? Style.Light : Style.Dark }); } catch (e) {} };
      window.__statusbar(document.documentElement.classList.contains("sun"));
    }
  } catch (e) {}
</script>
