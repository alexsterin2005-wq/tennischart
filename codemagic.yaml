workflows:
  ios-release:
    name: TennisChart iOS → App Store Connect
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: tennischart
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baselinebook.tennischart
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6828280095
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies and sync web build
        script: |
          npm ci --no-audit --no-fund
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
