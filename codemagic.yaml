workflows:
  ios-release:
    name: TennisChart iOS → App Store Connect
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: tennischart
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.baselinebook.tennischart
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6828280095
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies and sync web build
        script: |
          npm ci --no-audit --no-fund
          npx cap sync ios
      - name: Resolve Swift packages
        script: |
          cd ios/App && xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
